name: v5.8.13 Setup/Structured source inspection
on:
  push:
    branches: [feature/v5.8.13-pairing-style-and-structured-labels]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-v5813-source.cjs
