name: PADEL 5IVE — Package Frozen Final Backup ZIP
on:
  push:
    branches:
      - backup/final-v5.5.17-2026-11-09
    paths:
      - '.github/workflows/package-final-source.yml'

permissions:
  contents: write

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the frozen v5.5.17 source tree
        uses: actions/checkout@v4
        with:
          ref: backup/final-v5.5.17-2026-11-09
          persist-credentials: true
          fetch-depth: 1
      - name: Archive only the exact approved commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d9b5cf5937a5b0a14b6a60749db17788788d1683"
          git archive --format=zip --output=/tmp/PADEL5IVE_MATCH_CONTROL_FINAL_V5517_SOURCE.zip d9b5cf5937a5b0a14b6a60749db17788788d1683
          unzip -tq /tmp/PADEL5IVE_MATCH_CONTROL_FINAL_V5517_SOURCE.zip
          test "$(unzip -Z1 /tmp/PADEL5IVE_MATCH_CONTROL_FINAL_V5517_SOURCE.zip | grep -c '^[^/].*\(html\|mjs\|js\|css\|json\|webp\|png\|jpg\|toml\)$')" -gt 15
          for f in netlify.toml package.json public/index.html public/modes/unified/index.html public/modes/club-match/index.html public/assets/p5-direct-pdf.js public/assets/p5-fair-cycle-v5515.js public/assets/p5-keyboard-nav-v5516.js public/assets/p5-showdown-fixed-backdrop-v5517.css public/results/showdown/index.html netlify/functions/results.mjs netlify/functions/unified-results.mjs; do
            unzip -Z1 /tmp/PADEL5IVE_MATCH_CONTROL_FINAL_V5517_SOURCE.zip | grep -Fx "$f"
          done
          sha256sum /tmp/PADEL5IVE_MATCH_CONTROL_FINAL_V5517_SOURCE.zip
      - name: Store standalone ZIP only on backup branch (not production main)
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/PADEL5IVE_MATCH_CONTROL_FINAL_V5517_SOURCE.zip .
          rm -f .github/workflows/package-final-source.yml
          git config user.name "PADEL 5IVE Backup Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Archive PADEL 5IVE final v5.5.17 source ZIP (frozen)"
          git push origin HEAD:backup/final-v5.5.17-2026-11-09
