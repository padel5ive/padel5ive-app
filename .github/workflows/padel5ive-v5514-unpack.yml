name: PADEL 5IVE v5.5.14 - Unpack and Deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/padel5ive-v5514-unpack.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: padel5ive-v5514-unpack-main
  cancel-in-progress: false

jobs:
  unpack-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Verify exact uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          test -f PADEL5IVE_V5514_FULL_DEPLOY_VERIFIED.zip
          echo 'b408c9d740e1a353da78afa8683cb7738ec785d141d27e66ccb5952dda327125  PADEL5IVE_V5514_FULL_DEPLOY_VERIFIED.zip' | sha256sum -c -
          unzip -tq PADEL5IVE_V5514_FULL_DEPLOY_VERIFIED.zip | tail -1
      - name: Extract complete deployment source
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq PADEL5IVE_V5514_FULL_DEPLOY_VERIFIED.zip
          rm PADEL5IVE_V5514_FULL_DEPLOY_VERIFIED.zip
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify deployment package
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Commit full source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PADEL 5IVE Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Deploy PADEL 5IVE v5.5.14 full source"
          git push origin HEAD:main
