name: PADEL 5IVE v5.5.15 — Fairness + Reporting Deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/padel5ive-v5515-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p5-v5515-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Verify exact 5.5.14 base and release payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/p5-v5515-payload.b64
          test "$(git hash-object public/modes/unified/index.html)" = "9ca8ddcf2ebd144f4363fbf25b414ab01f1b35bb"
          test "$(git hash-object public/modes/club-match/index.html)" = "dbf99bd165cbf24b0d0cbd4e5dca68eec605dae0"
          echo "805721f001c75a99b59177cb0ef9f99db2285fb5afa17231944a577b25d56230  .github/p5-v5515-payload.b64" | sha256sum -c -
          base64 --decode .github/p5-v5515-payload.b64 > /tmp/padel5ive-v5515-patch.zip
          echo "f0f8b4393ba6e954f3b70380552185c4e0821999b86682117a8450c5731562fc  /tmp/padel5ive-v5515-patch.zip" | sha256sum -c -
          unzip -tq /tmp/padel5ive-v5515-patch.zip
      - name: Preserve critical engine and backend fingerprints
        shell: bash
        run: |
          set -euo pipefail
          sha256sum public/assets/p5-direct-pdf.js public/assets/p5-showdown-engine.js netlify/functions/unified-results.mjs netlify/functions/results.mjs > /tmp/p5-protected.sha256
      - name: Apply approved patch to full production source
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq /tmp/padel5ive-v5515-patch.zip
          python3 patch-release.py
          sha256sum --check /tmp/p5-protected.sha256
      - name: Verify build and 80 seeded scheduler scenarios
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run release validation
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm run build
          node scripts/qa-v5515.cjs
          test -f public/assets/p5-fair-cycle-v5515.js
          test -f docs/QA_REPORT_V5515.md
      - name: Commit full source to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f patch-release.py .github/p5-v5515-payload.b64 .github/workflows/padel5ive-v5515-deploy.yml
          git config user.name "PADEL 5IVE Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Deploy PADEL 5IVE v5.5.15 — fair Americano and refined public results"
          git push origin HEAD:main
