name: PADEL 5IVE v5.5.16 - Keyboard and Champion Polish
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/padel5ive-v5516-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: padel5ive-v5516-polish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Verify v5.5.15 source baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object public/modes/unified/index.html)" = "0d8d1e3a2eadf7e40e4bee4361e62111e30ab765"
          test "$(git hash-object public/modes/club-match/index.html)" = "bc9d09fd3f031f708a20fcf92bf88db0011904d5"
          test -s public/assets/p5-keyboard-nav-v5516.js
          test -s public/assets/p5-showdown-champion-v5516.css
          test -s public/results/showdown/index.html
          test -s public/assets/p5-showdown-results-v5514.js
          node --check public/assets/p5-keyboard-nav-v5516.js
          node --check public/assets/p5-showdown-results-v5514.js
          sha256sum public/assets/p5-direct-pdf.js public/assets/p5-showdown-engine.js             netlify/functions/results.mjs netlify/functions/unified-results.mjs             public/assets/p5-fair-cycle-v5515.js > /tmp/p5-protected.sha256
      - name: Activate shared iPad keyboard navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages=[
            Path('public/modes/unified/index.html'),
            Path('public/modes/club-match/index.html')
          ]
          for p in pages:
              html=p.read_text('utf-8')
              assert html.count('v5.5.15')==1, f'{p}: expected old header exactly once'
              assert 'p5-keyboard-nav-v5516.js' not in html, f'{p}: already patched'
              head,sep,tail=html.rpartition('</body>')
              assert sep and tail.strip().startswith('</html>'), f'{p}: invalid closing HTML'
              html=head+'<script src="/assets/p5-keyboard-nav-v5516.js" defer></script></body>'+tail
              html=html.replace('v5.5.15','v5.5.16',1)
              p.write_text(html,encoding='utf-8')
              assert html.count('p5-keyboard-nav-v5516.js')==1
              print('Patched',p,len(html))
          PY
      - name: Validate source and safety fingerprints
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check /tmp/p5-protected.sha256
          node --check public/assets/p5-keyboard-nav-v5516.js
          node --check public/assets/p5-showdown-results-v5514.js
          node scripts/qa-v5515.cjs
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm run build
          test "$(grep -o 'p5-keyboard-nav-v5516.js' public/modes/unified/index.html | wc -l)" = 1
          test "$(grep -o 'p5-keyboard-nav-v5516.js' public/modes/club-match/index.html | wc -l)" = 1
          grep -q 'p5-showdown-champion-v5516.css' public/results/showdown/index.html
          grep -q 'p5-win-trophy' public/results/showdown/index.html
          grep -q 'p5-win-stages' public/assets/p5-showdown-results-v5514.js
          if grep -qi 'RUNNER-UP' public/results/showdown/index.html public/assets/p5-showdown-results-v5514.js; then
             echo "Unexpected Runner-Up in Team Showdown public champion" >&2
             exit 1
          fi
      - name: Commit release source to main and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/padel5ive-v5516-polish.yml
          git config user.name "PADEL 5IVE Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Deploy PADEL 5IVE v5.5.16 - iPad Tab/Next and champion card"
          git push origin HEAD:main
