name: Cloud Moderator Persistent Ownership QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'netlify/functions/cloud-session.mjs'
      - 'public/phase58/cloud-dashboard.js'
      - 'public/phase58/cloud-home.js'
      - 'scripts/phase5814-integrate.cjs'
      - 'scripts/phase5822-integrate.cjs'
      - 'scripts/qa-cloud-moderator*'
      - '.github/workflows/qa-cloud-moderator-ownership.yml'
jobs:
  cloud-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: node scripts/qa-cloud-moderator-persistence.mjs
      - run: node scripts/qa-cloud-moderator-self-link.cjs
      - run: node scripts/qa-cloud-moderator-assets.cjs
      - run: node scripts/qa-phase58.mjs
      - run: node scripts/qa-v5823-short-cloud-credentials.cjs
      - run: node scripts/qa-pwa.cjs
