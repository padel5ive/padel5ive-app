name: Inspect Court Layout & Reschedule Anchors (review only)
on:
  pull_request:
    paths:
      - 'scripts/qa-court-layout-inspect.cjs'
      - '.github/workflows/qa-court-reschedule.yml'
      - 'scripts/court-reschedule-integrate.cjs'
      - 'scripts/qa-court-reschedule.cjs'
      - 'package.json'
jobs:
  court-reschedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/qa-court-layout-inspect.cjs
