name: PADEL 5IVE Team Showdown v0.3 HTML Attachment Export
on:
  push:
    branches:
      - lab-team-showdown-multidivision-master-ui
    paths:
      - .github/workflows/qa-download-team-showdown-v03.yml
permissions:
  contents: read
jobs:
  export-offline-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate native HTML
        run: |
          test -s public/labs/team-showdown-native-lab-v0.3.html
          grep -q 'TEAM SHOWDOWN' public/labs/team-showdown-native-lab-v0.3.html
      - name: Upload original offline HTML as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PADEL5IVE_TEAM_SHOWDOWN_NATIVE_MASTER_LAB_V0.3_HTML
          path: public/labs/team-showdown-native-lab-v0.3.html
          if-no-files-found: error
          retention-days: 7
