name: PADEL 5IVE · Full Baseline Audit (Read Only)
on:
  push:
    branches: [audit/shared-foundation-full-system-20261120]
permissions:
  contents: read
jobs:
  baseline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install repository QA dependencies
        run: |
          npm ci
          npm install --no-save jsdom@26
      - name: Compile exact locked baseline with all integrations
        run: npm run build
      - name: Audit game modes, every pairing, buttons, court changes, roster, sit-out, late arrival, UI and scheduling
        shell: bash
        run: |
          set -uo pipefail
          passed=0; failed=0
          run_case() {
            local area="$1" file="$2" budget="${3:-180}"
            echo "::group::[$area] $file"
            if timeout "${budget}s" node "$file" > /tmp/p5-audit-test.log 2>&1; then
              echo "PASS [$area] $file"
              tail -n 4 /tmp/p5-audit-test.log
              echo "PASS | $area | $file" >> /tmp/p5-audit-results.txt
              passed=$((passed+1))
            else
              local code=$?
              echo "::error file=$file::FAIL (exit $code)"
              tail -n 35 /tmp/p5-audit-test.log
              echo "FAIL | $area | $file (exit $code)" >> /tmp/p5-audit-results.txt
              failed=$((failed+1))
            fi
            echo "::endgroup::"
          }
          run_case pairing scripts/qa-all-pairing-modes-audit.cjs 220
          run_case pairing scripts/qa-structured-pairing-lab.cjs 180
          run_case pairing scripts/qa-structured-irregular-lab.cjs 180
          run_case pairing scripts/qa-structured-matchmaking-v2.cjs 180
          run_case pairing scripts/qa-structured-opponent-diversity.cjs 180
          run_case matchmaking scripts/qa-continuous-lab.cjs 180
          run_case matchmaking scripts/qa-v5515.cjs 180
          run_case matchmaking scripts/qa-v5516.cjs 180
          run_case court scripts/qa-court-reschedule.cjs 180
          run_case court scripts/qa-court-auto.cjs 180
          run_case court scripts/qa-extra-rounds.cjs 180
          run_case court scripts/qa-flexible-round-scoring.cjs 180
          run_case roster scripts/qa-v5812-smart-paste.cjs 180
          run_case roster scripts/qa-v5812-fixed-pair-review.cjs 180
          run_case roster scripts/qa-setup-registration.cjs 180
          run_case arrival scripts/qa-structured-late-return-density.cjs 180
          run_case coach scripts/qa-structured-matchmaking-v2.cjs 180
          run_case showdown scripts/qa-club-sitout.cjs 180
          run_case showdown scripts/qa-team-showdown-v097.cjs 180
          run_case showdown scripts/qa-team-showdown-v097-home.cjs 180
          run_case showdown scripts/qa-team-showdown-v097-dashboard-parity.cjs 180
          run_case showdown scripts/qa-team-showdown-v097-ipad-score-center.cjs 180
          run_case showdown scripts/qa-team-showdown-v097-report-parity.cjs 180
          run_case ui scripts/qa-pr36.cjs 180
          run_case ui scripts/qa-v5813-pairing-ui.cjs 180
          run_case ui scripts/qa-v585-source-audit.cjs 180
          run_case ui scripts/qa-v585-ui.cjs 180
          run_case ui scripts/qa-v583-ui.cjs 180
          run_case ui scripts/qa-v5814-view-only.cjs 180
          run_case ui scripts/qa-stage1-score-browser.cjs 420
          run_case ui scripts/qa-v152-browser-buttons.cjs 420
          node -e "const fs=require('fs'),a=fs.readFileSync('public/index.html','utf8');const b=a.match(/<button class=\\\"p54-mode\\\" type=\\\"button\\\" data-mode=/g)||[];if(b.length!==4||!a.includes('data-mode=\\\"Tournament Mode\\\" disabled aria-disabled=\\\"true\\\"')||a.includes('data-mode=\\\"Knockout\\\"'))process.exit(1);console.log('PASS baseline 4 modes')"
          echo "### PADEL 5IVE Baseline Audit" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: `ec48acf6fc448fbaf71aee7b55636fba78dac0b8`" >> "$GITHUB_STEP_SUMMARY"
          echo "PASS: $passed · FAIL: $failed" >> "$GITHUB_STEP_SUMMARY"
          echo 'Results are from the locked baseline without modifying production files.' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/p5-audit-results.txt >> "$GITHUB_STEP_SUMMARY"
          test "$failed" -eq 0
