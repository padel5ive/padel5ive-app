name: PADEL 5IVE Phase 5.7 Integration QA
on:
  push:
    branches: [feature/phase-5.7-integrated]
  pull_request:
    branches: [main, feature/session-hub-v5.7]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for approved baseline engine comparison
      - name: Install dependencies
        run: npm ci
      - name: Verify addon syntax
        run: |
          node --check public/phase57/home-session-history.js
          node --check public/phase57/champion-render-v571.js
          node --check scripts/phase57-transform.cjs
      - name: Integrate and validate published output
        run: |
          npm run build
          node --check public/assets/p5-interactive-results.js
          node --check public/assets/p5-direct-pdf.js
          node --check public/sw.js
          node scripts/qa-phase573.cjs
          node scripts/qa-phase574.cjs
          node --check netlify/functions/unified-share-page.mjs
          node --check netlify/functions/unified-social-image.mjs
          node --check netlify/functions/unified-results.mjs
      - name: Phase 5.7 regression guards
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const home=fs.readFileSync('public/index.html','utf8');
          const u=fs.readFileSync('public/modes/unified/index.html','utf8');
          const res=fs.readFileSync('public/results/unified/index.html','utf8');
          const sw=fs.readFileSync('public/sw.js','utf8');
          const api=fs.readFileSync('netlify/functions/unified-results.mjs','utf8');
          const pdf=fs.readFileSync('public/assets/p5-direct-pdf.js','utf8');
          const cases={
            'home history script':home.includes('/phase57/home-session-history.js'),
            'two clear stacked date/time fields':u.includes('class="p57-date-time p57-date-fields"')&&u.includes('>GAME DATE</span>')&&u.includes('>GAME TIME</span>'),
            'time validated':u.includes('Select a valid Game Time')&&u.includes(':00$'),
            '24 hourly options':u.includes('option value="00:00"')&&u.includes('option value="23:00"')&&!u.includes('id="setup-time" type="time"'),
            'date/time in dashboard':u.includes('<b>Date & Time</b>'),
            'time published':u.includes("time:state.time||''"),
            'session menu':u.includes("entry('Session Management'"),
            'no duplicated restore in setup':!u.includes('<div class="p5-v212-restore-home"><button type="button" data-act="restore">'),
            'Existing Sessions only in Home history':!u.includes('${homeExistingSessions(s)}</section>'),
            'refined shared time control loaded':u.includes('/phase57/setup-refinement-v572.css')&&fs.readFileSync('public/phase57/setup-refinement-v572.css','utf8').includes('5.7.3'),
            'refined Home CTA styling':fs.readFileSync('public/phase57/home-session-history.css','utf8').includes('Phase 5.7.2 — Home CTAs'),
            'centered public champion styling':fs.readFileSync('public/phase57/share-champion-v571.css','utf8').includes('centered hierarchy'),
            'winner no-KO':u.includes("winner=hasKO?(s.ko?.champion||[]):(leader[0]"),
            'PDF time':pdf.includes('dayDate(data.date)+(data.time?'),
            'OG preview':res.includes('PADEL 5IVE · Signature Game')&&res.includes('og:image:secure_url')&&res.includes('og:image:width'),
            'fixed public backdrop':res.includes('p5-unified-fixed-backdrop'),
            'public champion reveal assets':res.includes('/phase57/share-champion-v571.css')&&res.includes('/phase57/champion-render-v571.js'),
            'PWA cache':sw.includes('/phase57/home-session-history.js')&&sw.includes('/phase57/setup-refinement-v572.css')&&(sw.includes('p5-pwa-phase57-v577')||sw.includes('p5-pwa-phase58-lab-01')||sw.includes('p5-pwa-setup-prewarm-v588-1')),
            'server optional time':api.includes('if(s.time!==undefined'),
            'master engine present':u.includes('P5EngineRegistry')&&u.includes('P5KO')&&u.includes('P5PublicResults')
          };
          for(const [k,v] of Object.entries(cases))console.log((v?'PASS ':'FAIL ')+k);
          if(Object.values(cases).some(v=>!v))process.exit(1);
          NODE
          sum1="$(sha256sum public/modes/unified/index.html public/index.html public/assets/p5-direct-pdf.js public/results/unified/index.html | sha256sum)"
          # Phase57 has already run as part of npm build; recheck the layered v5.8 transform for idempotency.
          node scripts/phase58-transform.cjs
          sum2="$(sha256sum public/modes/unified/index.html public/index.html public/assets/p5-direct-pdf.js public/results/unified/index.html | sha256sum)"
          test "$sum1" = "$sum2"
          git diff --check
      - name: Protect locked scheduler, KO, and Club Match source
        run: |
          # The old whole-dashboard SHA was a Phase 5.7 snapshot, not a
          # scheduler checksum. A deliberately revised scoreboard must not
          # be rejected as a changed matchmaking engine.
          node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process'),assert=require('node:assert/strict');
          const baseline=cp.execFileSync('git',['show','8c833f9893ec57f550528dd74644a577eef77db9:public/modes/unified/index.html'],{maxBuffer:9*1024*1024}).toString();
          const current=fs.readFileSync('public/modes/unified/index.html','utf8');
          function sliceBetween(content,begin,end){
            const a=content.indexOf(begin),b=content.indexOf(end,a+begin.length);
            assert(a>=0&&b>a,'Engine protection anchor drift: '+begin);
            return content.slice(a,b);
          }
          for(const [label,begin,end] of [
            ['individual, fixed, recovery, constraints and registry engines','window.P5EngineIndividual=','window.P5UI='],
            ['seeded knockout','window.P5KO=','</script>']
          ]){
            assert.equal(sliceBetween(current,begin,end),sliceBetween(baseline,begin,end),label+' changed');
            console.log('PASS locked '+label);
          }
          NODE
          # Club Match source changes are intentional in PR #28: verified Sit Out and Return only.
          # The new checkpoint SHA replaces the pre-feature frozen Club Match source.
          test "$(git show HEAD:public/modes/club-match/index.html | git hash-object --stdin)" = "b4328a7cd61f7739d9cb6c04f5d1c95d46c10ace"
          node scripts/qa-club-sitout.cjs
          test "$(grep -Fc 'data-p58-cloud' public/modes/club-match/index.html)" -eq 1
          node scripts/qa-flexible-round-scoring.cjs
