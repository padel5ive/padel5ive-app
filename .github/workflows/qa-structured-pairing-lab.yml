name: PADEL 5IVE Structured Pairing Fairness Lab
on:
  push:
    branches: [fix/structured-pairing-fairness-20261111]
  pull_request:
    branches: [main]
concurrency:
  group: structured-pairing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  structured-engine-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run qa:structured
      - run: git diff --check
