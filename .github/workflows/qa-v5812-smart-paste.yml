name: PADEL 5IVE v5.8.12 Smart Player Input QA
on:
  push:
    branches: [feature/v5.8.12-smart-player-paste]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save jsdom@26
      - name: Validate smart paste and unchanged core master
        run: |
          node scripts/qa-v5812-smart-paste.cjs
          node scripts/qa-v5810-viewer.cjs
          node scripts/qa-v589-cloud-whatsapp.cjs
          node scripts/qa-pwa.cjs
          node --check public/assets/p5-smart-player-input-v5812.js
          git diff --check
