name: PADEL 5IVE v5.8.13 Pairing Styles + Structured Labels QA
on:
  push:
    branches: [feature/v5.8.13-pairing-style-and-structured-labels]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save jsdom@26
      - name: Test Pairing Style and Structured Registration
        run: |
          node scripts/qa-v5813-pairing-ui.cjs
          node scripts/qa-v5812-smart-paste.cjs
          node scripts/qa-v5812-fixed-pair-review.cjs
          node scripts/qa-v5810-viewer.cjs
          node scripts/qa-v589-cloud-whatsapp.cjs
          node scripts/qa-pwa.cjs
          git diff --check
