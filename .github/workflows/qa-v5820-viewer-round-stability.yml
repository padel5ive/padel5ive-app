name: PADEL 5IVE v5.8.20 Viewer Round Stability QA
on:
  pull_request:
    paths:
      - 'public/phase58/cloud-dashboard.js'
      - 'scripts/phase5814-integrate.cjs'
      - 'scripts/qa-v5814-view-only.cjs'
      - 'scripts/qa-v5820-viewer-round-stability.cjs'
      - '.github/workflows/qa-v5820-viewer-round-stability.yml'
jobs:
  viewer-round-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: node scripts/qa-v5820-viewer-round-stability.cjs
      - run: node scripts/qa-v5810-viewer.cjs
      - run: node scripts/qa-v5814-view-only.cjs
