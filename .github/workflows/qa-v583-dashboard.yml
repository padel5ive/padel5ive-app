name: PADEL 5IVE v5.8.3 Dashboard UX Audit
on:
  push:
    branches: [fix/v5.8.3-dashboard-cleanup-chevron]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect unmodified source markup
        run: node scripts/qa-v583-source-audit.cjs
      - name: Inspect build output markup and verify
        run: |
          npm ci
          npm run build
          node scripts/qa-v583-source-audit.cjs
