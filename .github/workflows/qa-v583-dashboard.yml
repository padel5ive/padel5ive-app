name: PADEL 5IVE v5.8.3 Dashboard UI QA
on:
  push:
    branches: [fix/v5.8.3-dashboard-cleanup-chevron]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Assemble production assets with isolated cosmetic transform
        run: npm run build
      - name: Assert dashboard cleanup, score UI, intact fairness monitor, share chevron, and JS syntax
        run: node scripts/qa-v583-ui.cjs
      - name: Regression tests
        run: |
          node scripts/qa-v5516.cjs
          node scripts/qa-phase574.cjs
          node scripts/qa-phase58-markup.cjs
          node scripts/qa-phase581-pwa-fullscreen.cjs
          node scripts/qa-phase582-home-cta.cjs
          git diff --check
