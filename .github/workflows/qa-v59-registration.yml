name: PADEL 5IVE v5.9 Registration Import Preview QA
on:
  push:
    branches: [feature/v5.9-registration-import-preview]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: UI and original game regression
        run: |
          node --check public/phase59/registration-import-preview-v590.js
          npm install --no-save jsdom@26
          node scripts/qa-v59-registration.cjs
          node scripts/qa-v585-ui.cjs
          node scripts/qa-v586-background.cjs
          node scripts/qa-v587-home.cjs
          node scripts/qa-v583-ui.cjs
          node scripts/qa-phase574.cjs
          node scripts/qa-pwa.cjs
          git diff --check
