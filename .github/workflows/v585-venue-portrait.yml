name: PADEL 5IVE v5.8.5 Venue Portrait
on:
  workflow_dispatch:
  push:
    branches: [feature/v5.8.5-visual-navigation-review]
    paths:
      - scripts/phase585-venue-art.py
      - .github/workflows/v585-venue-portrait.yml
permissions:
  contents: write
jobs:
  create-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Inspect original PADEL 5IVE venue photo
        run: python scripts/phase585-venue-art.py --inspect
      - name: Create continuous court portrait
        run: python scripts/phase585-venue-art.py
      - name: Commit portrait only on development branch
        run: |
          git config user.name 'PADEL 5IVE CI'
          git config user.email 'actions@users.noreply.github.com'
          git add public/phase585/home-venue-portrait.webp
          if git diff --cached --quiet; then
            echo 'Venue artwork unchanged'
          else
            git commit -m 'art(v585): add continuous court portrait'
            git push origin HEAD:feature/v5.8.5-visual-navigation-review
          fi
