# PADEL 5IVE · Unified v5.4.13 · Production-ready project layout
# Important: keep functions outside the public publish directory.
[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/cloud-session"
  to = "/.netlify/functions/cloud-session"
  status = 200
  force = true

# Short Viewer Links: /v/CODE.RANDOM96, rewritten to the existing landing app.
# A token alone confers View Only; Moderator PIN is never embedded.
[[redirects]]
  from = "/v/*"
  to = "/index.html"
  status = 200
  force = true

[[headers]]
  for = "/v/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "private, no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/api/unified-results"
  to = "/.netlify/functions/unified-results"
  status = 200
  force = true

[[redirects]]
  from = "/api/results"
  to = "/.netlify/functions/results"
  status = 200
  force = true

# Dynamic public results /u/:id and /social/u/* are handled by
# Netlify Functions config.path (avoids unsupported splat-to-query rewrites).

[[redirects]]
  from = "/r/*"
  to = "/results/showdown/index.html"
  status = 200
  force = true
